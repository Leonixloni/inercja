<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja</title>
</head>

<body>

    <h1>Rejestracja</h1>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Nazwa użytkownika"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Hasło"
            required
        >

        <button type="submit">Zarejestruj się</button>

    </form>

    <p id="message"></p>
<script src="register.js"></script>
</body>
</html>
