<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inercja - Test STW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <img src="Inercja.png" alt="Inercja Logo" class="logo" onerror="this.style.display='none'">
            <h1>Inercja: Szczególna Teoria Względności</h1>
            <p>Zaawansowany panel weryfikacji wiedzy fizycznej</p>
        </header>

        <main>
            <div id="quiz-container" class="card">
                <div id="progress" class="progress-bar">Ładowanie...</div>
                <div id="question" class="question-text">Tutaj pojawi się pytanie.</div>
                <div id="options-container" class="options-grid"></div>
                <div class="controls">
                    <button id="prev-btn" class="btn btn-secondary">Poprzednie</button>
                    <button id="next-btn" class="btn btn-primary">Następne</button>
                </div>
            </div>

            <div id="result-container" class="card" style="display: none;">
                <h2>Koniec testu!</h2>
                <div id="score" class="score-display"></div>
                <div id="review-container"></div>
                <button onclick="location.reload()" class="btn btn-primary">Podejdź ponownie</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
